<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jadwal NOC JTS</title>
<meta name="description" content="Jadwal shift petugas NOC JTS.">
<meta name="theme-color" content="#ece8dd">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preload" href="/fonts/archivo-latin-wdth-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="halaman">

  <header class="kop">
    <div class="merek">
      <h1>NOC JTS</h1>
      <p>Jadwal shift petugas · <span id="bulan-label"></span></p>
    </div>
    <div class="jam">
      <div class="jam-angka"><span id="jam-hm">--:--</span><span id="jam-s">:--</span></div>
      <div class="jam-ket"><span id="tgl-ket">&nbsp;</span> · WIB</div>
    </div>
  </header>

  <nav class="tab" role="tablist" aria-label="Menu">
    <button role="tab" id="t-hari" aria-controls="v-hari" aria-selected="true">Hari ini</button>
    <button role="tab" id="t-jadwal" aria-controls="v-jadwal" aria-selected="false">Jadwal bulan</button>
  </nav>

  <main>
    <!-- ===== HARI INI ===== -->
    <section id="v-hari" role="tabpanel" aria-labelledby="t-hari">
      <div class="bar">
        <h2 class="label" id="h-judul">Jaga</h2>
        <div class="kontrol">
          <button id="h-prev" class="btn kecil" type="button">&larr; Kemarin</button>
          <button id="h-kini" class="btn kecil" type="button">Hari ini</button>
          <button id="h-next" class="btn kecil" type="button">Besok &rarr;</button>
        </div>
      </div>
      <div class="tgl-besar" id="h-tgl"></div>
      <div id="h-lanjut" class="lanjut" hidden></div>
      <ul id="papan" class="papan"></ul>
    </section>

    <!-- ===== JADWAL ===== -->
    <section id="v-jadwal" role="tabpanel" aria-labelledby="t-jadwal" hidden>
      <div class="bar">
        <div class="kontrol">
          <h2 class="label">Jadwal shift</h2>
          <select id="j-bulan" aria-label="Bulan"></select>
        </div>
        <div id="f-jadwal" class="filter" role="group" aria-label="Sorot petugas"></div>
      </div>
      <div class="gulung">
        <table class="tabel jadwal" id="tb-jadwal"></table>
      </div>

      <h2 class="label spasi">Jam kerja per shift</h2>
      <div class="gulung">
        <table class="tabel pola" id="tb-pola"></table>
      </div>
      <p class="catatan">Jam di atas 24:00 berarti lewat tengah malam. Khusus Jumat pagi, jam kerja efektif dimulai 09:30.</p>
    </section>
  </main>

  <footer class="kaki">Jadwal diperbarui dari file jadwal bulanan NOC JTS.</footer>
</div>

<script src="/lib/core.js"></script>
<script src="/app.js"></script>
</body>
</html>
